PUBLIC_APP_MODE = true

# Streamlit Cloud / hosted app settings
# Put your GitHub repository slug here so the hosted app can dispatch workflows.
GITHUB_REPO_SLUG = "owner/repo"

# Token with permission to dispatch GitHub Actions workflows.
GITHUB_TOKEN = "ghp_your_token_here"

# Optional alias if you prefer GH_TOKEN instead of GITHUB_TOKEN.
# GH_TOKEN = "ghp_your_token_here"

# GitHub Actions secrets are still stored in the GitHub repository settings:
# DART_API_KEY
# KRX_ID
# KRX_PW
# GOOGLE_DRIVE_FOLDER_ID
# GOOGLE_SERVICE_ACCOUNT_JSON