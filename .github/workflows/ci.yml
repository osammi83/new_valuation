name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Compile core scripts
        shell: powershell
        run: |
          python -m py_compile run_pipeline.py build_daily_report.py score_daily_signals.py manage_positions.py train_models.py publish_to_drive.py upload_to_google_drive.py ops_admin.py validate_outputs.py validate_csv_contracts.py

      - name: Check UTF-8 BOM for CSV files
        shell: powershell
        run: |
          $missing = Get-ChildItem -Path . -Recurse -Filter *.csv | Where-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            -not ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          }
          if ($missing) {
            $missing | ForEach-Object { Write-Host $_.FullName }
            throw 'Some CSV files are missing UTF-8 BOM.'
          }
